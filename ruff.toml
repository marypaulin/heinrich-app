target-version = "py312"

[lint]
# Ruff 0.16 enables a broad default rule set. These are the deliberate exceptions.
# COM812 (missing-trailing-comma) is deliberately NOT enabled: the formatter's magic
# trailing comma is the control surface -- add a comma by hand where a construct
# should stay exploded. Enforcing it everywhere would remove that choice, and ruff
# warns about the combination on every format run.
ignore = [
    "LOG015",  # project logs via the root logger throughout; switching to
               # getLogger(__name__) is a deliberate refactor, not a lint fix
    "DTZ",     # naive local dates are intentional (German invoicing, no timezones)
]

[lint.per-file-ignores]
"demo/**" = [
    "BLE001",  # prototypes catch broadly on purpose
    "B008",    # Qt APIs require QModelIndex() as a default argument
]
"src/backend/pdfgen.py" = [
    "BLE001",  # catch-all around Word/LibreOffice subprocess failures is intentional
]
